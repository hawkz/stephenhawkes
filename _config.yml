remote_theme: hawkz/pixyll

# Site
title: Stephen Hawkes
email: steve@dev.ngo
author: Stephen Hawkes
description: "Stephen Hawkes - he has kept news"
baseurl: ""
url: "https://stephenhawkes.com"
lang: en-GB
timezone: Europe/London
date_format: ordinal

header_pages:
  - about.md
  - contact.html

# Publishing
# Keep `pretty` for backwards compatibility: older posts have category-based
# URLs such as /blog/... while newer posts do not. New content uses tags rather
# than categories so taxonomy no longer changes its URL.
permalink: pretty
paginate: 7
future: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Theme features actually in use
animated: false
show_related_posts: true
show_post_footers: false
show_social_icons: false
show_sharing_icons: false
ajaxify_contact_form: false
enable_mathjax: false
extended_fonts: false
enable_anchorjs: false

github_username: hawkz
twitter_username: hawkz

# Verification / analytics
google_verification:
google_analytics:
google_tag_manager:
bing_verification:

text:
  pagination:
    newer: Newer
    older: Older
  post:
    updated: Updated
    minute_read: minute read
    related_posts: See also
  index:
    coming_soon: Coming soon...
  contact:
    email: Email Address
    content: What would you like to say?
    subject: New submission!
    submit: Say Hello
  thanks: Thanks for contacting me. I will reply as soon as possible.
  og_locale: en_GB

# Build
markdown: kramdown
sass:
  style: compressed
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - README.md
  - screenshot.png
  - vendor
